name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest # arm64
          - runner: ubuntu-latest # x64
          - runner: ubuntu-24.04-arm # arm64
          - runner: windows-latest # x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify release tag matches package version
        run: node -e 'const p=require("./apps/framio/package.json"); if(process.env.GITHUB_REF_NAME !== "v"+p.version) throw new Error("Release tag must match package version")'
      - run: bun install --frozen-lockfile
      - run: bun run build:ui
      - run: bun run format:check
      - name: Allow Chromium sandbox user namespaces
        if: runner.os == 'Linux'
        # Ubuntu's AppArmor restriction blocks the downloaded Chrome for Testing.
        # Keep Chromium's sandbox enabled on this ephemeral runner.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun run check
        if: runner.os != 'Windows'
      - run: bun run typecheck && bun run test:effect
        if: runner.os == 'Windows'
      - run: bun test apps/framio/tests/windows
        if: runner.os == 'Windows'
      # Only the steps that talk to PostHog receive the personal API key.
      - name: Enable source map injection when credentials exist
        shell: bash
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
        run: |
          if [ -n "$POSTHOG_CLI_API_KEY" ] && [ -n "$POSTHOG_CLI_PROJECT_ID" ]; then
            echo "FRAMIO_POSTHOG_SOURCEMAPS=1" >> "$GITHUB_ENV"
          fi
      - run: bun run build:binary
        id: binary
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: https://us.posthog.com
      - name: Upload source maps from the shipped binary build
        if: env.FRAMIO_POSTHOG_SOURCEMAPS == '1'
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: https://us.posthog.com
        run: bun x --package @posthog/cli@0.18.9 posthog-cli sourcemap upload --directory apps/framio/dist/sourcemaps --release-name framio --release-version "${{ github.ref_name }}"
      - name: Smoke test
        shell: bash
        run: |
          bin=$(ls apps/framio/dist/bin/framio-* | grep -v '\.tar\.gz$')
          python3 apps/framio/scripts/smoke-binary.py "$bin"
          python3 apps/framio/scripts/smoke-updater.py "$bin"
      - name: Windows installer, canvas and browser checks
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.binary.outcome == 'success' }}
        run: python apps/framio/scripts/smoke-windows.py apps/framio/dist/bin/framio-win32-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: framio-${{ matrix.runner }}
          path: apps/framio/dist/bin/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish checksums and authored release notes
        run: |
          notes="releases/$GITHUB_REF_NAME.md"
          test -s "$notes"
          python3 - "$notes" <<'PY'
          import pathlib, sys
          description, _, details = pathlib.Path(sys.argv[1]).read_text().strip().partition("\n\n")
          if not description or description.startswith("#") or len(description) > 280:
              raise SystemExit("Start release notes with a short authored paragraph of at most 280 characters")
          heading, _, changes = details.strip().partition("\n")
          if not heading.startswith("#") or not changes.strip():
              raise SystemExit("Follow the description with a heading and detailed changes")
          PY
          (cd artifacts && sha256sum *.tar.gz > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" artifacts/*.tar.gz artifacts/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
