name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest # arm64
          - runner: macos-15-intel # x64
          - runner: ubuntu-latest # x64
          - runner: ubuntu-24.04-arm # arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build:ui
      - run: bun run format:check
      - name: Allow Chromium sandbox user namespaces
        if: runner.os == 'Linux'
        # Ubuntu's AppArmor restriction blocks the downloaded Chrome for Testing.
        # Keep Chromium's sandbox enabled on this ephemeral runner.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun run check
      - run: bun run build:binary
      - name: Smoke test
        run: |
          bin=$(ls dist/bin/framio-* | grep -v '\.tar\.gz$')
          python3 scripts/smoke-binary.py "$bin"
      - uses: actions/upload-artifact@v4
        with:
          name: framio-${{ matrix.runner }}
          path: dist/bin/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" artifacts/*.tar.gz --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
