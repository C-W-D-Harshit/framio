name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build:ui
      - run: bun run format:check
      - name: Allow Chromium sandbox user namespaces
        # Ubuntu's AppArmor restriction blocks the downloaded Chrome for Testing.
        # Keep Chromium's sandbox enabled on this ephemeral runner.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun run check
      - run: bun run build:binary
      - run: python3 scripts/smoke-binary.py dist/bin/framio-linux-x64
